<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber Hood Manager</title><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Barber Hood"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f2f6fc;--cd:#fff;--tx:#05070b;--mu:#586275;--ac:#0a84ff;--ac2:#0057d9;--ok:#12a150;--ko:#e5483a;--bd:#d9e2ef;--hd:#000;background:var(--hd);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cd:#0d1118;--tx:#f5f6f2;--mu:#98a3b5;--ac:#2196ff;--ac2:#0a5fe0;--ok:#32d583;--ko:#ff6b5e;--bd:#1c2535;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--cd:#0d1118;--tx:#f5f6f2;--mu:#98a3b5;--ac:#2196ff;--ac2:#0a5fe0;--ok:#32d583;--ko:#ff6b5e;--bd:#1c2535;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-wrap:anywhere;touch-action:manipulation}
img,svg{max-width:100%}
.hd{background:#000;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--ac)}
.hd img{height:46px;width:auto;display:block}
.hd b{display:block;color:#fff;font-size:17px;letter-spacing:1px;text-transform:uppercase;line-height:1.1}
.hd small{color:#6db6ff}
.off{display:none;background:var(--ko);color:#fff;text-align:center;padding:5px;font-weight:700;font-size:13px}
#app{max-width:640px;margin:0 auto;padding:12px 12px calc(96px + env(safe-area-inset-bottom,0px))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:2px;background:#000;border-top:2px solid var(--ac);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:0;min-height:54px;border:0;background:none;color:#9aa4b5;font:inherit;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;border-radius:14px;transition:transform .12s}
nav button i{font-style:normal;font-size:22px;line-height:1}
nav button:active{transform:scale(.94)}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px -6px var(--ac)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--ac)}
input,select,textarea{width:100%;box-sizing:border-box;margin:0 0 10px;padding:11px;min-height:46px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;transition:border-color .15s,box-shadow .15s}
input:not([type=checkbox]){-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(33,150,255,.28)}
.b{width:100%;min-height:52px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:800;letter-spacing:.8px;text-transform:uppercase;box-shadow:0 8px 20px -8px var(--ac);transition:transform .12s}
.b:active{transform:scale(.97)}.b:disabled{opacity:.5}
.seg{display:flex;gap:6px;margin:0 0 10px;background:var(--bg);padding:4px;border-radius:14px}
.seg button{flex:1;min-height:42px;border:0;background:none;color:var(--mu);border-radius:10px;font:inherit;font-weight:700}
.seg button.on{background:var(--ac);color:#fff}
.ed{width:auto;min-height:38px;margin:0 4px 0 0;padding:4px 6px;font-size:14px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.k div{min-width:0;background:var(--cd);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:14px;padding:10px}
.k div:nth-child(1){border-top-color:var(--ok)}.k div:nth-child(2){border-top-color:var(--ko)}
.k small,.mu,small{color:var(--mu)}.k small{display:block;font-size:12px}.k b{display:block;font-size:clamp(14px,4.4vw,19px)}
.k small.ing{color:var(--ok)}.k small.gas{color:var(--ko)}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.r>span:first-child{min-width:0}.r b{white-space:nowrap}
.r button{border:0;background:none;color:var(--ko);font-size:22px;min-width:40px;min-height:40px}
.r .go{background:var(--ac);color:#fff;border-radius:18px;padding:8px 16px;font-size:14px;font-weight:700;min-height:40px;margin-right:6px}
.ing,.pos{color:var(--ok)}.gas,.neg{color:var(--ko)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:90%;text-align:center;background:var(--ac);color:#fff;font-weight:700;padding:10px 18px;border-radius:24px;box-shadow:0 8px 24px -6px #000;display:none;z-index:20}
#fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:34px;line-height:1;box-shadow:0 10px 26px -6px var(--ac);display:none;z-index:7;transition:transform .15s}
#fab:active{transform:scale(.9) rotate(90deg)}
.mo{position:fixed;inset:0;z-index:12;display:none}
.mo .bk{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.mo .sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;box-sizing:border-box;background:var(--cd);border-radius:20px 20px 0 0;border-top:3px solid var(--ac);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.chip{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:20px;padding:9px 14px;margin:0 6px 6px 0;font:inherit;font-weight:600;min-height:40px}
.chip:active,.chip.on{background:var(--ac);color:#fff}
textarea{min-height:76px;resize:vertical}
.r[data-a]{cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal b{font-size:12px;color:var(--mu)}.cal button{position:relative;min-height:44px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:inherit}.cal button.hoy{border-color:var(--ac)}.cal button.on{background:var(--ac);color:#fff}.cal em{position:absolute;right:2px;top:1px;font-size:10px;font-style:normal;background:var(--ko);color:#fff;border-radius:8px;padding:0 4px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:12px 14px;margin:0 0 8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:14px;font:inherit;font-weight:700;text-align:left}
</style></head><body>
<header class="hd"><img src="logo.png" alt="BH"><div><b>Barber Hood Manager</b><small>Gestión de la barbería</small></div></header>
<div class="off" id="off">Sin conexión: los cambios no se guardarán</div>
<div id="app"><p class="mu">Cargando…</p></div><button id="fab" data-a="fab" aria-label="Agregar ingreso">+</button><div class="mo" id="mo"><div class="bk" data-a="close"></div><div class="sh" id="sh"></div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const $=s=>document.querySelector(s),v=i=>document.getElementById(i).value;
const S={cfg:{barberos:[],servicios:[]},movs:[],turnos:[],dueno:[],productos:[],smov:[],liq:[],adel:[],tcan:[],bAll:[],asist:[],me:null,op:null,caja:null,cr:null,cajas:[],cmov:[],tv:'dia',tb:'',sel:[],qm:'ing',cq:'',cf:'',clientes:[],cbar:[],rdur:30,tab:'ini',per:'sem',ref:iso(new Date()),pub:location.hash=='#reservar',admin:false,owner:false,db:null,dirty:0};
const today=()=>iso(new Date());
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((t,x)=>t+(+x.m||0),0);
function rng(){const d=new Date(S.ref+'T00:00:00'),r=S.ref;if(S.per=='dia')return[r,r];
if(S.per=='sem'){const s=new Date(d);s.setDate(d.getDate()-(d.getDay()+6)%7);const e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e)]}
if(S.per=='mes')return[r.slice(0,8)+'01',r.slice(0,8)+'31'];return[r.slice(0,4)+'-01-01',r.slice(0,4)+'-12-31']}
const inMes=x=>{const[a,b]=rng(),f=x.fecha||'';return f>=a&&f<=b};
const bname=id=>(S.bAll.find(b=>b.id===id)||{}).nombre||'';
const barOpts=()=>(S.me?'':'<option value="">Sin barbero</option>')+S.cfg.barberos.filter(b=>!S.me||b.id==S.me).map(b=>`<option value="${esc(b.id)}">${esc(b.n)}</option>`).join('');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500)}

function kpis(a,b,l){return `<div class="k"><div><small>Ingresos</small><b class="pos">${fmt(a)}</b></div><div><small>Gastos</small><b class="neg">${fmt(b)}</b></div><div><small>${l||'Neto'}</small><b>${fmt(a-b)}</b></div></div>`}
function row(m,col){const c=col||(m.t=='ing'?'ingresos':'gastos'),ed=S.owner&&!m.liq;return `<div class="r"><span>${ed?`<input type="date" class="ed" value="${esc(m.fecha)}" data-c="${c}" data-i="${esc(m.id)}">`:esc((m.fecha||'').slice(5))} ${esc(m.c)}<br><small>${esc(m.k||'')} ${esc(bname(m.b))}${m.t=='ing'&&m.cm?' · com. '+fmt(m.cm):''}${m.liq?' · liquidado':''}${m.t=='ing'&&!m.cob?' · ⏳ sin cobrar':''}${m.mp&&m.mp!='efectivo'?' · '+m.mp:''}</small></span><b class="${m.t}">${m.t=='gas'?'-':''}${fmt(m.m)}</b>${ed?`<button data-a="del" data-c="${c}" data-i="${esc(m.id)}">×</button>`:''}</div>`}
function com(){const M=S.movs.filter(x=>inMes(x)&&x.t=='ing');return S.cfg.barberos.map(b=>{const s=sum(M.filter(x=>x.b==b.id&&x.k=='servicio')),p=sum(M.filter(x=>x.b==b.id&&x.k=='producto')),c=M.filter(x=>x.b==b.id).reduce((t,x)=>t+(+x.cm||0),0);return{b,s,p,c}})}

const V={
caja(){const M=S.movs.filter(inMes).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.ts-a.ts);
const CM=com().filter(x=>x.c>0),tc=CM.reduce((a,x)=>a+x.c,0);return kpis(sum(M.filter(m=>m.t=='ing')),sum(M.filter(m=>m.t=='gas'))+tc+M.filter(m=>m.t=='ing').reduce((a,m)=>a+(m.cu||0)*(m.q||1),0))+(tc?`<div class="c"><h3>Comisiones de barberos (gasto variable)</h3>${CM.map(x=>`<div class="r"><span>${esc(x.b.n)}</span><b class="gas">-${fmt(x.c)}</b></div>`).join('')}</div>`:'')+`${pcard()}<div class="c"><h3>Registrar</h3>
<select id="mk"><option value="ing|servicio">Ingreso · servicio</option><option value="ing|producto">Ingreso · producto</option><option value="gas|fijo">Gasto fijo</option><option value="gas|variable">Gasto variable</option></select>
<input id="mc" list="sv" placeholder="Concepto"><datalist id="sv">${S.cfg.servicios.map(s=>`<option value="${esc(s.n)}">`).join('')}</datalist>
<input id="mm" type="number" inputmode="decimal" placeholder="Monto"><select id="mb">${barOpts()}</select><input id="md" type="date" value="${today()}">
<button class="b" data-a="addmov">Guardar</button></div>
<div class="c"><h3>Movimientos del período</h3>${M.map(m=>row(m)).join('')||'<p class="mu">Sin movimientos.</p>'}</div>`},
tur(){const T=S.turnos.filter(t=>!t.done&&t.f>=today()).sort((a,b)=>(a.f+a.h).localeCompare(b.f+b.h));
return `<div class="c"><h3>Nuevo turno</h3><input id="tf" type="date" value="${nextOpen()}"><select id="th">${slotOpts(nextOpen(),'')}</select><small>¿Otra hora? Elegila a mano:</small><input id="thm" type="time"><input id="tc" placeholder="Cliente">
<select id="tb">${barOpts()}</select><select id="tsv"><option value="">Servicio</option>${S.cfg.servicios.map(s=>`<option>${esc(s.n)}</option>`).join('')}</select>
<button class="b" data-a="addtur">Reservar</button></div>
<div class="c"><h3>Próximos turnos</h3>${T.map(t=>`<div class="r"><span>${esc(t.f.slice(5))} ${esc(t.h)} · ${esc(t.c)}<br><small>${esc(t.s||'')} ${esc(bname(t.b))}</small></span><span><button class="go" data-a="tdet" data-i="${esc(t.id)}">Cobrar</button><button data-a="del" data-c="turnos" data-i="${esc(t.id)}">×</button></span></div>`).join('')||'<p class="mu">No hay turnos.</p>'}</div>`},
com(){const C=com();const t=C.reduce((a,x)=>a+x.c,0);
return `<div class="c"><h3>Comisiones del período</h3>${C.map(x=>`<div class="r"><span>${esc(x.b.n)}<br><small>Serv. ${fmt(x.s)} · Prod. ${fmt(x.p)} · pendiente total ${fmt(pendF(x.b.id))}</small></span><span><b>${fmt(x.c)}</b> <button class="go" data-a="liq" data-i="${esc(x.b.id)}">Liquidar</button></span></div>`).join('')||'<p class="mu">Cargá barberos en Ajustes.</p>'}<div class="r"><b>Total del período</b><b>${fmt(t)}</b></div></div>${cardAdel()}${cardLiq()}`},
due(){const M=S.dueno.filter(inMes).sort((a,b)=>b.fecha.localeCompare(a.fecha));const i=sum(M.filter(m=>m.t=='ing')),g=sum(M.filter(m=>m.t=='gas'));
const[ra,rb]=rng(),r=res(ra,rb);
return `<div class="c"><h3>Resultado de la barbería</h3><small>Ingresos − gastos − comisiones − costo de productos vendidos</small><div class="r"><span>Ingresos ${fmt(r.ing)} · Gastos ${fmt(r.fijo+r.vari)} · Comisiones ${fmt(r.com)} · Costo prod. ${fmt(r.cogs)}</span><b>${fmt(r.net)}</b></div></div>
<h3 style="margin:4px 2px">Mis ingresos y gastos (privado)</h3>${kpis(i,g)}
<div class="c"><select id="dt"><option value="ing">Ingreso</option><option value="gas">Gasto</option></select><input id="dc" placeholder="Concepto"><input id="dm" type="number" inputmode="decimal" placeholder="Monto"><input id="dd" type="date" value="${today()}"><button class="b" data-a="adddue">Guardar</button></div>
<div class="c">${M.map(m=>row(m,'dueno_mov')).join('')||'<p class="mu">Sin movimientos.</p>'}</div>`},
aj(){return bk()+disp()+`<div class="c"><h3>Barberos y comisión</h3><small>Prioridad: excepción del barbero > % general del barbero > % del servicio o producto.</small>${S.cfg.barberos.map(b=>`<div style="border-top:1px solid var(--bd);padding:10px 0"><div class="r" style="border:0;padding:0 0 8px"><span>${esc(b.n)} <small>${b.min||30} min · ${b.uid?'usuario vinculado':'sin usuario'}</small></span><button data-a="delbar" data-i="${esc(b.id)}">×</button></div>
<div style="display:flex;gap:8px"><input id="bp_${esc(b.id)}" type="number" placeholder="% general (vacío = el del servicio)" value="${b.cp==null?'':b.cp}" style="margin:0"><button class="chip" data-a="setbp" data-i="${esc(b.id)}">Guardar %</button></div>
${S.cbar.filter(x=>x.b==b.id).map(x=>`<div class="r"><small>${esc(nameItem(x))}: ${x.pct}%</small><button data-a="delexc" data-i="${esc(x.id)}">×</button></div>`).join('')}
<div style="display:flex;gap:6px;margin-top:8px"><select id="xi_${esc(b.id)}" style="margin:0">${itemOpts()}</select><input id="xp_${esc(b.id)}" type="number" placeholder="%" style="margin:0;width:84px"><button class="chip" data-a="addexc" data-i="${esc(b.id)}">+ Excepción</button></div></div>`).join('')}
<input id="bn" placeholder="Nombre del barbero"><input id="bm" type="number" placeholder="Minutos por turno (ej. 30)"><input id="be" type="email" placeholder="Email de su usuario (opcional)"><button class="b" data-a="addbar">Agregar barbero</button></div>
<div class="c"><h3>Servicios y comisión</h3>${S.cfg.servicios.map(s=>`<div class="r"><span>${esc(s.n)} <small>${fmt(s.p)} · comisión ${s.cp}% · ${s.dur?s.dur+' min':'duración según barbero'}</small></span><button data-a="delsrv" data-i="${esc(s.id)}">×</button></div>`).join('')}
<input id="sn" placeholder="Servicio (ej. Corte)"><input id="sp" type="number" placeholder="Precio"><input id="sc" type="number" placeholder="% comisión del barbero"><input id="sd" type="number" placeholder="Duración en minutos (opcional)"><button class="b" data-a="addsrv">Agregar servicio</button></div>`}};

const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const H=()=>{const d={1:[['10:00','20:00']],2:[['10:00','20:00']],3:[['10:00','20:00']],4:[['10:00','20:00']],5:[['10:00','20:00']],6:[['10:00','18:00']],0:[]},c=S.cfg.horario||{};for(const k in c){const x=c[k]||[];d[k]=x.length&&typeof x[0]=='string'?[x]:x}return d};
const hm=x=>+x.slice(0,2)*60+ +x.slice(3),pad=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const bmin=b=>{const x=S.cfg.barberos.find(y=>y.id==b);return +(x&&x.min)||+S.cfg.slot||30};
function slotsB(f,b,ds){if(!f||f<today())return[];const rs=H()[new Date(f+'T00:00:00').getDay()]||[],st=bmin(b),dur=ds&&ds.length?ds.reduce((t,s)=>t+(s.dur||st),0):st,now=new Date().toTimeString().slice(0,5),
bz=S.turnos.filter(t=>t.f==f&&(t.b||'')==b).map(t=>[hm(t.h),hm(t.h)+(+t.d||st)]),o=[];
rs.forEach(r=>{for(let x=hm(r[0]);x+dur<=hm(r[1]);x+=st)if(!bz.some(z=>x<z[1]&&x+dur>z[0])&&(f>today()||pad(x)>now))o.push(pad(x))});return o}
const slots=(f,b,ds)=>b||!S.cfg.barberos.length?slotsB(f,b||'',ds):[...new Set(S.cfg.barberos.flatMap(x=>slotsB(f,x.id,ds)))].sort();
const pick=(f,h,b,ds)=>b||(S.cfg.barberos.find(x=>slotsB(f,x.id,ds).includes(h))||{}).id||'';
const slotOpts=(f,b,ds)=>slots(f,b,ds).map(s=>`<option>${s}</option>`).join('')||'<option value="">Sin horarios</option>';
const rs2=x=>x.map(r=>r.join('-')).join(', ');
const pr=s=>s.split(',').map(x=>x.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/)).filter(Boolean).map(m=>[m[1].padStart(2,'0')+':'+m[2],m[3].padStart(2,'0')+':'+m[4]]);
