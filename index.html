<style>
:root{--bg:#f2f6fc;--cd:#fff;--tx:#05070b;--mu:#586275;--ac:#0a84ff;--ac2:#0057d9;--ok:#12a150;--ko:#e5483a;--bd:#d9e2ef;--hd:#000;background:var(--hd);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cd:#0d1118;--tx:#f5f6f2;--mu:#98a3b5;--ac:#2196ff;--ac2:#0a5fe0;--ok:#32d583;--ko:#ff6b5e;--bd:#1c2535;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--cd:#0d1118;--tx:#f5f6f2;--mu:#98a3b5;--ac:#2196ff;--ac2:#0a5fe0;--ok:#32d583;--ko:#ff6b5e;--bd:#1c2535;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.hd{background:#000;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:3px solid var(--ac)}
.hd img{height:46px;width:auto;display:block}
.hd b{display:block;color:#fff;font-size:17px;letter-spacing:1px;text-transform:uppercase;line-height:1.1}
.hd small{color:#6db6ff}
#app{max-width:640px;margin:0 auto;padding:12px 12px 40px}
nav{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
nav button{flex:none;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:24px;padding:10px 16px;font:inherit;font-weight:600;transition:transform .12s,box-shadow .2s}
nav button:active{transform:scale(.95)}
nav button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 6px 18px -6px var(--ac)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}
h3{margin:0 0 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--ac)}
input,select{width:100%;box-sizing:border-box;margin:0 0 8px;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(33,150,255,.28)}
.b{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:inherit;font-weight:800;letter-spacing:.8px;text-transform:uppercase;box-shadow:0 8px 20px -8px var(--ac);transition:transform .12s,box-shadow .2s}
.b:hover{box-shadow:0 10px 26px -6px var(--ac)}.b:active{transform:scale(.97)}
.seg{display:flex;gap:6px;margin:0 0 10px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);border-radius:9px;padding:9px 0;font:inherit;font-weight:700;transition:background .15s,color .15s}
.seg button.on{background:var(--ac);color:#fff}
.ed{width:auto;margin:0 4px 0 0;padding:4px 6px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.k div{background:var(--cd);border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:14px;padding:10px}
.k div:nth-child(1){border-top-color:var(--ok)}.k div:nth-child(2){border-top-color:var(--ko)}
.k small,.mu,small{color:var(--mu)}.k b{display:block;font-size:18px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)}
.r button{border:0;background:none;color:var(--ko);font-size:20px;padding:0 6px}
.r .go{background:var(--ac);color:#fff;border-radius:16px;padding:6px 14px;font-size:13px;font-weight:700;margin-right:6px}
.r .go:active{transform:scale(.94)}
.ing,.pos{color:var(--ok)}.gas,.neg{color:var(--ko)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:#fff;font-weight:700;padding:10px 18px;border-radius:24px;box-shadow:0 8px 24px -6px #000;display:none}
#fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:36px;line-height:1;box-shadow:0 10px 26px -6px var(--ac);display:none;z-index:5;transition:transform .15s}
#fab:active{transform:scale(.9) rotate(90deg)}
.mo{position:fixed;inset:0;z-index:9;display:none}
.mo .bk{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.mo .sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:88vh;overflow:auto;box-sizing:border-box;background:var(--cd);border-radius:20px 20px 0 0;border-top:3px solid var(--ac);padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.chip{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:20px;padding:7px 13px;margin:0 6px 6px 0;font:inherit;font-weight:600}
.chip:active{background:var(--ac);color:#fff}
#toast{z-index:20}

<script>
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const $=s=>document.querySelector(s),v=i=>document.getElementById(i).value;
const S={cfg:{barberos:[],servicios:[]},movs:[],turnos:[],dueno:[],tab:'caja',per:'sem',ref:iso(new Date()),pub:location.hash=='#reservar',admin:false,owner:false,db:null,dirty:0};
const today=()=>iso(new Date());
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((t,x)=>t+(+x.m||0),0);
function rng(){const d=new Date(S.ref+'T00:00:00'),r=S.ref;if(S.per=='dia')return[r,r];
if(S.per=='sem'){const s=new Date(d);s.setDate(d.getDate()-(d.getDay()+6)%7);const e=new Date(s);e.setDate(s.getDate()+6);return[iso(s),iso(e)]}
if(S.per=='mes')return[r.slice(0,8)+'01',r.slice(0,8)+'31'];return[r.slice(0,4)+'-01-01',r.slice(0,4)+'-12-31']}
const inMes=x=>{const[a,b]=rng(),f=x.fecha||'';return f>=a&&f<=b};
const bname=id=>(S.cfg.barberos.find(b=>b.id===id)||{}).n||'';
const barOpts=()=>'<option value="">Sin barbero</option>'+S.cfg.barberos.map(b=>`<option value="${esc(b.id)}">${esc(b.n)}</option>`).join('');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2500)}

function kpis(a,b,l){return `<div class="k"><div><small>Ingresos</small><b class="pos">${fmt(a)}</b></div><div><small>Gastos</small><b class="neg">${fmt(b)}</b></div><div><small>${l||'Neto'}</small><b>${fmt(a-b)}</b></div></div>`}
function row(m,col){return `<div class="r"><span><input type="date" class="ed" value="${esc(m.fecha)}" data-c="${col||'movs'}" data-i="${esc(m.id)}"> ${esc(m.c)}<br><small>${esc(m.k||'')} ${esc(bname(m.b))}</small></span><b class="${m.t}">${m.t=='gas'?'-':''}${fmt(m.m)}</b>${S.admin||col=='dueno'?`<button data-a="del" data-c="${col||'movs'}" data-i="${esc(m.id)}">×</button>`:''}</div>`}
function com(){const M=S.movs.filter(x=>inMes(x)&&x.t=='ing');return S.cfg.barberos.map(b=>{const s=sum(M.filter(x=>x.b==b.id&&x.k=='servicio')),p=sum(M.filter(x=>x.b==b.id&&x.k=='producto'));return{b,s,p,c:s*b.ps/100+p*b.pp/100}})}

const V={
caja(){const M=S.movs.filter(inMes).sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.ts-a.ts);
const CM=com().filter(x=>x.c>0),tc=CM.reduce((a,x)=>a+x.c,0);return kpis(sum(M.filter(m=>m.t=='ing')),sum(M.filter(m=>m.t=='gas'))+tc)+(tc?`<div class="c"><h3>Comisiones de barberos (gasto variable)</h3>${CM.map(x=>`<div class="r"><span>${esc(x.b.n)}</span><b class="gas">-${fmt(x.c)}</b></div>`).join('')}</div>`:'')+`<div class="c"><h3>Registrar</h3>

<input id="mc" list="sv" placeholder="Concepto"><datalist id="sv">${S.cfg.servicios.map(s=>`<option value="${esc(s.n)}">`).join('')}</datalist>
<input id="mm" type="number" inputmode="decimal" placeholder="Monto"><select id="mb">${barOpts()}</select><input id="md" type="date" value="${today()}">
<button class="b" data-a="addmov">Guardar</button></div>
<div class="c"><h3>Movimientos del período</h3>${M.map(m=>row(m)).join('')||'<p class="mu">Sin movimientos.</p>'}</div>`},
tur(){const T=S.turnos.filter(t=>!t.done&&t.f>=today()).sort((a,b)=>(a.f+a.h).localeCompare(b.f+b.h));
return `<div class="c"><h3>Nuevo turno</h3><input id="tf" type="date" value="${nextOpen()}"><select id="th">${slotOpts(nextOpen(),'')}</select><small>¿Otra hora? Elegila a mano:</small><input id="thm" type="time"><input id="tc" placeholder="Cliente">
<select id="tb">${barOpts()}</select><select id="tsv"><option value="">Servicio</option>${S.cfg.servicios.map(s=>`<option>${esc(s.n)}</option>`).join('')}</select>
<button class="b" data-a="addtur">Reservar</button></div>
<div class="c"><h3>Próximos turnos</h3>${T.map(t=>`<div class="r"><span>${esc(t.f.slice(5))} ${esc(t.h)} · ${esc(t.c)}<br><small>${esc(t.s||'')} ${esc(bname(t.b))}</small></span><span><button class="go" data-a="cobrar" data-i="${esc(t.id)}">Cobrar</button><button data-a="del" data-c="turnos" data-i="${esc(t.id)}">×</button></span></div>`).join('')||'<p class="mu">No hay turnos.</p>'}</div>`},
com(){const C=com();const t=C.reduce((a,x)=>a+x.c,0);
return `<div class="c"><h3>Comisiones del período</h3>${C.map(x=>`<div class="r"><span>${esc(x.b.n)}<br><small>Serv. ${fmt(x.s)} (${x.b.ps}%) · Prod. ${fmt(x.p)} (${x.b.pp}%)</small></span><b>${fmt(x.c)}</b></div>`).join('')||'<p class="mu">Cargá barberos en Ajustes.</p>'}<div class="r"><b>Total a pagar</b><b>${fmt(t)}</b></div></div>`},
due(){const M=S.dueno.filter(inMes).sort((a,b)=>b.fecha.localeCompare(a.fecha));const i=sum(M.filter(m=>m.t=='ing')),g=sum(M.filter(m=>m.t=='gas'));
const B=S.movs.filter(inMes),bi=sum(B.filter(m=>m.t=='ing')),bg=sum(B.filter(m=>m.t=='gas')),cm=com().reduce((a,x)=>a+x.c,0);
return `<div class="c"><h3>Resultado de la barbería</h3><small>Ingresos − gastos − comisiones</small><div class="r"><span>Ingresos ${fmt(bi)} · Gastos ${fmt(bg)} · Comisiones ${fmt(cm)}</span><b>${fmt(bi-bg-cm)}</b></div></div>
<h3 style="margin:4px 2px">Mis ingresos y gastos (privado)</h3>${kpis(i,g)}
<div class="c"><select id="dt"><option value="ing">Ingreso</option><option value="gas">Gasto</option></select><input id="dc" placeholder="Concepto"><input id="dm" type="number" inputmode="decimal" placeholder="Monto"><input id="dd" type="date" value="${today()}"><button class="b" data-a="adddue">Guardar</button></div>
<div class="c">${M.map(m=>row(m,'dueno')).join('')||'<p class="mu">Sin movimientos.</p>'}</div>`},
aj(){return bk()+disp()+`<div class="c"><h3>Barberos</h3>${S.cfg.barberos.map(b=>`<div class="r"><span>${esc(b.n)} <small>${b.ps}% serv. · ${b.pp}% prod. · ${b.min||S.cfg.slot||30} min</small></span><button data-a="delbar" data-i="${esc(b.id)}">×</button></div>`).join('')}
<input id="bn" placeholder="Nombre"><input id="bm" type="number" placeholder="Minutos por turno (ej. 30)"><input id="bs" type="number" placeholder="% comisión servicios"><input id="bp" type="number" placeholder="% comisión productos"><button class="b" data-a="addbar">Agregar barbero</button></div>
<div class="c"><h3>Servicios</h3>${S.cfg.servicios.map((s,i)=>`<div class="r"><span>${esc(s.n)} <small>${fmt(s.p)}</small></span><button data-a="delsrv" data-i="${i}">×</button></div>`).join('')}
<input id="sn" placeholder="Servicio (ej. Corte)"><input id="sp" type="number" placeholder="Precio"><button class="b" data-a="addsrv">Agregar servicio</button></div>`}};

const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const H=()=>{const d={1:[['10:00','20:00']],2:[['10:00','20:00']],3:[['10:00','20:00']],4:[['10:00','20:00']],5:[['10:00','20:00']],6:[['10:00','18:00']],0:[]},c=S.cfg.horario||{};for(const k in c){const x=c[k]||[];d[k]=x.length&&typeof x[0]=='string'?[x]:x}return d};
const hm=x=>+x.slice(0,2)*60+ +x.slice(3),pad=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const bmin=b=>{const x=S.cfg.barberos.find(y=>y.id==b);return +(x&&x.min)||+S.cfg.slot||30};
function slotsB(f,b){if(!f||f<today())return[];const rs=H()[new Date(f+'T00:00:00').getDay()]||[],st=bmin(b),now=new Date().toTimeString().slice(0,5),
bz=S.turnos.filter(t=>t.f==f&&(t.b||'')==b).map(t=>[hm(t.h),hm(t.h)+(+t.d||st)]),o=[];
rs.forEach(r=>{for(let x=hm(r[0]);x+st<=hm(r[1]);x+=st)if(!bz.some(z=>x<z[1]&&x+st>z[0])&&(f>today()||pad(x)>now))o.push(pad(x))});return o}
const slots=(f,b)=>b||!S.cfg.barberos.length?slotsB(f,b||''):[...new Set(S.cfg.barberos.flatMap(x=>slotsB(f,x.id)))].sort();
const pick=(f,h,b)=>b||(S.cfg.barberos.find(x=>slotsB(f,x.id).includes(h))||{}).id||'';
const slotOpts=(f,b)=>slots(f,b).map(s=>`<option>${s}</option>`).join('')||'<option value="">Sin horarios</option>';
const rs2=x=>x.map(r=>r.join('-')).join(', ');
const pr=s=>s.split(',').map(x=>x.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})$/)).filter(Boolean).map(m=>[m[1].padStart(2,'0')+':'+m[2],m[3].padStart(2,'0')+':'+m[4]]);
const disp=()=>{const h=H();return `<div class="c"><h3>Disponibilidad</h3><small>Podés poner varios tramos por día separados por coma (ej. 10:00-13:00, 15:00-20:00). Los minutos de cada turno se definen por barbero, abajo.</small><small>Duración por defecto (min)</small><input id="sl" type="number" value="${S.cfg.slot||30}">${[1,2,3,4,5,6,0].map(d=>`<div class="r"><label><input type="checkbox" id="hd${d}" style="width:auto;margin:0" ${(h[d]||[]).length?'checked':''}> ${DN[d]}</label><input id="ha${d}" value="${rs2(h[d]||[])}" placeholder="10:00-13:00, 15:00-20:00" style="width:62%;margin:0"></div>`).join('')}<button class="b" data-a="savehor">Guardar horarios</button></div>`};
V.res=()=>`<div class="c"><h3>Reservá tu turno</h3><input id="rn" placeholder="Tu nombre"><input id="rt" type="tel" placeholder="Teléfono"><input id="rf" type="date" min="${today()}" value="${nextOpen()}"><select id="rb">${barOpts().replace('Sin barbero','Cualquier barbero')}</select><select id="rh">${slotOpts(nextOpen(),'')}</select><select id="rs"><option value="">Servicio</option>${S.cfg.servicios.map(s=>`<option>${esc(s.n)}</option>`).join('')}</select><button class="b" data-a="addres">Reservar</button></div>`;
const CFG={url:'https://gbrutjlhdcnnlghoaxlu.supabase.co',key:'sb_publishable_TT3gfpD1H2Fp8rUqHhPosw__ZmnZ0dK'};
let sb=null,D={},L={},ROL='';
const fire=n=>(L[n]||[]).forEach(f=>f());
const on=(n,f)=>{(L[n]=L[n]||[]).push(f);f();return()=>{}};
async function load(){const{data,error}=await sb.from('datos').select('col,id,data');if(error){toast('Error de conexión');return}
D={};data.forEach(r=>{(D[r.col]=D[r.col]||{})[r.id]=r.data});Object.keys(L).forEach(fire)}
const wr=async(n,id,o)=>{const{error}=await sb.from('datos').upsert({col:n,id,data:o});if(error)throw error;(D[n]=D[n]||{})[id]=o;fire(n)};
const SDB={collection:n=>({add:async o=>{const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);await wr(n,id,o);return{id}},
onSnapshot:f=>on(n,()=>f({docs:Object.entries(D[n]||{}).map(([id,x])=>({id,data:()=>x}))}))}),
doc:p=>{const[n,id]=p.split('/');return{set:o=>wr(n,id,o),update:o=>wr(n,id,{...(D[n]||{})[id],...o}),
delete:async()=>{const{error}=await sb.from('datos').delete().match({col:n,id});if(error)throw error;delete (D[n]||{})[id];fire(n)},
onSnapshot:f=>on(n,()=>f({exists:!!(D[n]&&D[n][id]),data:()=>(D[n]||{})[id]}))}}};
async function boot(){
if(!CFG.url){try{Object.assign(CFG,JSON.parse(localStorage.getItem('bh-cfg')||'{}'))}catch(e){}}
if(!CFG.url||!CFG.key){$('#app').innerHTML='<div class="c"><h3>Conectar Supabase</h3><input id="su" placeholder="Project URL (https://xxxx.supabase.co)"><input id="sk" placeholder="Clave anon / publishable"><button class="b" data-a="savecfg">Conectar</button></div>';return}
if(typeof supabase=='undefined'){$('#app').innerHTML='<div class="c">No se pudo cargar Supabase. Revisá tu conexión.</div>';return}
sb=supabase.createClient(CFG.url,CFG.key);
const{data:{session}}=await sb.auth.getSession();
if(!session){$('#app').innerHTML='<div class="c"><h3>Ingresar</h3><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Clave"><button class="b" data-a="login">Ingresar</button><button class="b" data-a="resetcfg" style="margin-top:8px;background:var(--mu)">Cambiar URL o clave</button></div>';return}
const{data:p}=await sb.from('perfiles').select('rol').eq('id',session.user.id).maybeSingle();
ROL=(p&&p.rol)||'staff';S.admin=ROL!='staff';S.owner=ROL=='owner';S.email=session.user.email;
S.db=SDB;await load();
sb.channel('datos').on('postgres_changes',{event:'*',schema:'public',table:'datos'},load).subscribe();setInterval(load,20000);render()}
const bk=()=>`<div class="c"><h3>Cuenta</h3><p class="mu">${esc(S.email)} · ${ROL=='owner'?'Dueño':ROL=='admin'?'Editor':'Equipo'}</p><button class="b" data-a="salir">Cerrar sesión</button></div>`;
const save=()=>S.db.doc('cfg/main').set(S.cfg);
const A={
tab(d){S.tab=d.i;render()},
fab(){$('#sh').innerHTML=`<h3>Nuevo ingreso</h3>${S.cfg.servicios.length?'<small>Tocá un servicio para completar el precio</small><div style="margin:6px 0">'+S.cfg.servicios.map((s,i)=>`<button class="chip" data-a="qs" data-i="${i}">${esc(s.n)} · ${fmt(s.p)}</button>`).join('')+'</div>':''}<select id="qt"><option value="servicio">Servicio</option><option value="producto">Producto</option></select><input id="qc" placeholder="Servicio o producto (nuevo o existente)"><input id="qm" type="number" inputmode="decimal" placeholder="Monto"><select id="qb">${barOpts()}</select><input id="qd" type="date" value="${today()}">${S.admin?'<label class="mu"><input type="checkbox" id="qg" style="width:auto;margin:0 6px 0 0"> Guardar como servicio de la lista</label>':''}<button class="b" data-a="qsave" style="margin-top:10px">Registrar ingreso</button>`;$('#mo').style.display='block'},
close(){$('#mo').style.display='none'},
qs(d){const s=S.cfg.servicios[d.i];$('#qt').value='servicio';$('#qc').value=s.n;$('#qm').value=s.p},
async qsave(){const c=v('qc').trim(),m=+v('qm');if(!c||!(m>0))return toast('Completá concepto y monto');
await S.db.collection('movs').add({t:'ing',k:v('qt'),c,m,b:v('qb'),fecha:v('qd')||today(),ts:Date.now()});
if(S.admin&&$('#qg')&&$('#qg').checked&&v('qt')=='servicio'&&!S.cfg.servicios.some(x=>x.n==c)){S.cfg={...S.cfg,servicios:[...S.cfg.servicios,{n:c,p:m}]};await save()}
A.close();toast('Ingreso registrado')},
async salir(){await sb.auth.signOut();location.reload()},
async login(){const{error}=await sb.auth.signInWithPassword({email:v('le').trim(),password:v('lp')});if(error)return toast(/fetch|load failed|network/i.test(error.message)?'No se pudo conectar: revisá la URL':'Email o clave incorrectos');location.reload()},
resetcfg(){localStorage.removeItem('bh-cfg');location.reload()},
savecfg(){let u=v('su').trim(),k=v('sk').trim();const m=u.match(/^https:\/\/[a-z0-9-]+\.supabase\.co/i);if(!m||!k)return toast('La URL debe ser https://xxxx.supabase.co');u=m[0];localStorage.setItem('bh-cfg',JSON.stringify({url:u,key:k}));location.reload()},
per(d){S.per=d.i;render()},
async savehor(){const hr={};for(let d=0;d<7;d++){const k=$('#hd'+d).checked,r=k?pr(v('ha'+d)):[];if(k&&!r.length)return toast('Revisá el horario de '+DN[d]);hr[d]=r}S.cfg={...S.cfg,slot:+v('sl')||30,horario:hr};await save();toast('Horarios guardados')},
async addres(){const n=v('rn').trim(),t=v('rt').trim();if(!n||!t||!v('rh'))return toast('Completá nombre, teléfono y horario');
await S.db.collection('turnos').add({c:n+' · '+t,f:v('rf'),h:v('rh'),b:pick(v('rf'),v('rh'),v('rb')),d:bmin(pick(v('rf'),v('rh'),v('rb'))),s:v('rs'),done:false,pend:true});
$('#app').innerHTML='<div class="c"><h3>¡Turno reservado!</h3><p>'+esc(v('rf')?'':'')+'Te esperamos. Si necesitás cambiarlo, avisanos.</p></div>'},
async addmov(){const[t,k]=v('mk').split('|'),m=+v('mm'),c=v('mc').trim();if(!(m>0)||!c)return toast('Completá concepto y monto');
await S.db.collection('movs').add({t,k,c,m,b:t=='ing'?v('mb'):'',fecha:v('md')||today(),ts:Date.now()});$('#mc').value='';$('#mm').value='';toast('Guardado')},
async del(d){await S.db.doc(d.c+'/'+d.i).delete()},
async addtur(){const c=v('tc').trim();const hh=v('thm')||v('th');if(!c||!v('tf')||!hh)return toast('Completá fecha, hora y cliente');
const bb=pick(v('tf'),hh,v('tb'));await S.db.collection('turnos').add({c,f:v('tf'),h:hh,b:bb,d:bmin(bb),s:v('tsv'),done:false});toast('Turno reservado')},
async cobrar(d){const t=S.turnos.find(x=>x.id==d.i),s=S.cfg.servicios.find(x=>x.n==t.s);
await S.db.collection('movs').add({t:'ing',k:'servicio',c:t.s||'Servicio',m:s?s.p:0,b:t.b,fecha:t.f,ts:Date.now()});await S.db.doc('turnos/'+t.id).update({done:true});toast('Cobrado')},
async adddue(){const m=+v('dm'),c=v('dc').trim();if(!(m>0)||!c)return toast('Completá concepto y monto');
await S.db.collection('dueno').add({t:v('dt'),c,m,fecha:v('dd')||today(),ts:Date.now()});$('#dc').value='';$('#dm').value=''},
async addbar(){const n=v('bn').trim();if(!n)return;S.cfg={...S.cfg,barberos:[...S.cfg.barberos,{id:'b'+Date.now().toString(36),n,min:+v('bm')||0,ps:+v('bs')||0,pp:+v('bp')||0}]};await save()},
async delbar(d){S.cfg={...S.cfg,barberos:S.cfg.barberos.filter(b=>b.id!=d.i)};await save()},
async addsrv(){const n=v('sn').trim();if(!n)return;S.cfg={...S.cfg,servicios:[...S.cfg.servicios,{n,p:+v('sp')||0}]};await save()},
async delsrv(d){S.cfg={...S.cfg,servicios:S.cfg.servicios.filter((_,i)=>i!=d.i)};await save()}};

function fabv(){const f=$('#fab');if(f)f.style.display=S.db&&!S.pub&&(S.tab=='caja'||S.tab=='tur')?'block':'none'}
function nextOpen(){for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()+i);const f=iso(d);if(slots(f,'').length)return f}return today()}
function render(){fabv();const a=document.activeElement;
if(a&&a.closest('#app')&&/INPUT|SELECT/.test(a.tagName)){S.dirty=1;return}S.dirty=0;
if(!S.db){$('#app').innerHTML='<div class="c">Iniciá sesión en Claude para usar la app.</div>';return}
if(S.pub){$('#app').innerHTML=V.res();return}
const T=[['caja','💈 Barbería'],['tur','📅 Turnos'],['com','💰 Comisiones','a'],['due','👑 Dueño','o'],['aj','⚙️ Ajustes','a']].filter(t=>!t[2]||(t[2]=='a'?S.admin:S.owner));
if(!T.some(t=>t[0]==S.tab))S.tab='caja';
$('#app').innerHTML=`<nav>${T.map(t=>`<button class="${t[0]==S.tab?'on':''}" data-a="tab" data-i="${t[0]}">${t[1]}</button>`).join('')}</nav>
${S.tab=='tur'||S.tab=='aj'?'':`<div class="c"><div class="seg">${[['dia','Día'],['sem','Semana'],['mes','Mes'],['ano','Año']].map(p=>`<button class="${S.per==p[0]?'on':''}" data-a="per" data-i="${p[0]}">${p[1]}</button>`).join('')}</div><input type="date" id="mes" value="${S.ref}" style="margin:0 0 4px"><small>${rng()[0]} → ${rng()[1]}</small></div>`}${V[S.tab]()}`}

document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;try{await A[t.dataset.a](t.dataset)}catch(x){toast('No se pudo guardar')}});
document.addEventListener('change',e=>{const t=e.target;if(t.classList.contains('ed')){if(t.value)S.db.doc(t.dataset.c+'/'+t.dataset.i).update({fecha:t.value}).catch(()=>toast('No se pudo guardar'));t.blur();return}
if(['tf','tb'].includes(t.id))$('#th').innerHTML=slotOpts(v('tf'),v('tb'));if(['rf','rb'].includes(t.id))$('#rh').innerHTML=slotOpts(v('rf'),v('rb'));
if(t.id=='mes'){S.ref=t.value||S.ref;t.blur();render()}
if(e.target.id=='mc'){const s=S.cfg.servicios.find(x=>x.n==e.target.value);if(s&&!$('#mm').value)$('#mm').value=s.p}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.dirty)render()},150));

(async()=>{try{
await boot();if(!S.db)return;
const er=()=>toast('Error de conexión');
S.db.doc('cfg/main').onSnapshot(d=>{if(d.exists)S.cfg={barberos:[],servicios:[],...d.data()};render()},er);
const sub=n=>S.db.collection(n).onSnapshot(s=>{S[n]=s.docs.map(d=>({id:d.id,...d.data()}));render()},er);
sub('movs');sub('turnos');if(S.owner)sub('dueno');
}catch(x){render()}})();
</script></body></html>
